<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Invincible Gif</title>
</head>
<body>
    <h1 align="center">Random invincible Gif</h1>
    <button id="random" onclick="searchGifs()">New gif!</button>
    <img src="" alt="" id="gif">

    <script src="env.js"></script>
    <script>
        let img = document.getElementById("gif")
        async function searchGifs() {
        try {
            let randomNum = Math.floor(Math.random() * 50) 
            console.log(randomNum)
            const url = `https://api.giphy.com/v1/gifs/search?api_key=eiwCJ0YLNsfYGmLs8zAE2jKtbL4l9YO7&q=${encodeURIComponent("omniman")}`;
            
            const response = await fetch(url);
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const resData = await response.json();
            console.log(resData.data[randomNum]);
            let randomUrl = "https://i.giphy.com/" + resData.data[randomNum].id + ".gif"
            img.src = randomUrl
        } catch (error) {
            console.error("Error fetching data from Giphy:", error);
        }
    }
    </script>
</body>
</html>
